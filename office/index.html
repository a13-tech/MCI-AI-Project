<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MCI Virtual Office & Command Center</title>
  <style>
    :root {
      --b: #0A2A6B;
      --g: #D4AF37;
      --o: #E8742C;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #061638;
      color: #10213f;
      font: 13px/1.4 system-ui, Segoe UI, Roboto, sans-serif;
      --in: rgba(14, 35, 95, .6);
    }
    body.pagi {
      --in: rgba(240, 246, 255, .82);
    }
    body.sore {
      --in: rgba(255, 232, 210, .72);
    }
    header {
      background: var(--b);
      color: #fff;
      padding: 8px 14px;
      border-bottom: 1px solid var(--g);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    h1 {
      font-size: 15px;
      margin: 0;
    }
    h1 b {
      color: var(--g);
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-left: auto;
      align-items: center;
    }
    .chip {
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .25);
      color: #fff;
      border-radius: 99px;
      padding: 3px 10px;
      font-size: 11px;
      cursor: pointer;
    }
    .chip.on {
      background: #fff;
      color: var(--b);
    }
    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e55;
      margin-right: 4px;
    }
    .on .dot {
      background: #2c9;
    }
    #tk {
      font-size: 11px;
      color: #cfe0ff;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
      gap: 10px;
      padding: 10px;
    }
    @media(max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .card h2 {
      margin: 0 0 6px;
      font-size: 11px;
      color: var(--b);
      text-transform: uppercase;
      letter-spacing: .8px;
    }
    #stage {
      position: relative;
      width: 100%;
      aspect-ratio: 800/560;
      overflow: hidden;
      border: 1px solid var(--g);
      border-radius: 8px;
      background: #020617;
    }
    #world {
      position: absolute;
      left: 0;
      top: 0;
      width: 800px;
      height: 560px;
      transform-origin: 0 0;
      transition: transform 1s ease;
    }
    #bg {
      position: absolute;
      left: 0;
      top: 0;
      width: 800px;
      height: 560px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }
    .row button,
    .fm button,
    #send {
      background: var(--b);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 11px;
      cursor: pointer;
    }
    .row button.on {
      background: var(--g);
      color: #2a2000;
    }
    .fl {
      position: absolute;
      left: 40px;
      width: 580px;
      height: 125px;
      background: var(--in);
      border-bottom: 5px solid #0A2A6B;
      border-left: 3px solid var(--g);
    }
    .fl::after {
      content: '';
      position: absolute;
      left: 30px;
      right: 30px;
      top: 0;
      height: 3px;
      background: #fff8d0;
      box-shadow: 0 4px 14px 4px rgba(255, 235, 160, .3);
    }
    .lab {
      position: absolute;
      left: 4px;
      top: 5px;
      font: 700 8px system-ui;
      background: #0A2A6B;
      color: #fff;
      padding: 1px 6px;
      border-radius: 3px;
      border-left: 2px solid var(--g);
      z-index: 2;
    }
    .it {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      border-radius: 3px;
      text-align: center;
      color: #fff;
      background: #4a5f8f;
      border: 1px solid rgba(255, 255, 255, .35);
      line-height: 1.1;
      padding: 1px;
    }
    #shell {
      position: absolute;
      left: 37px;
      top: 40px;
      width: 656px;
      height: 500px;
      border: 2px solid var(--g);
      pointer-events: none;
      z-index: 6;
    }
    #roof {
      position: absolute;
      left: 37px;
      top: 22px;
      width: 656px;
      height: 18px;
      background: #0A2A6B;
      border: 1px solid var(--g);
      color: #fff;
      font: 700 9px system-ui;
      letter-spacing: 3px;
      text-align: center;
      line-height: 16px;
    }
    body.malam #shell {
      box-shadow: 0 0 18px #38e1ff99, 0 0 40px #ff3df255;
    }
    #shaft {
      position: absolute;
      left: 620px;
      top: 40px;
      width: 70px;
      height: 500px;
      background: repeating-linear-gradient(to bottom, transparent 0 120px, #0A2A6B 120px 125px), rgba(160, 220, 255, .12);
      border-left: 1px solid rgba(160, 220, 255, .5);
    }
    #lift {
      position: absolute;
      left: 626px;
      top: 80px;
      width: 58px;
      height: 80px;
      background: linear-gradient(rgba(190, 240, 255, .3), rgba(190, 240, 255, .08));
      border: 2px solid rgba(200, 245, 255, .85);
      border-radius: 4px;
      z-index: 4;
      transition: top 1.6s ease-in-out;
      font: 700 7px system-ui;
      color: #cfeaff;
      text-align: center;
    }
    .st {
      position: absolute;
      left: 700px;
      width: 80px;
      height: 120px;
      clip-path: polygon(0 100%, 100% 0, 100% 100%);
      background: repeating-linear-gradient(135deg, #dbe4f5 0 4px, #6f87b8 4px 8px);
      opacity: .85;
    }
    .st.f {
      transform: scaleX(-1);
    }
    .bot {
      position: absolute;
      width: 30px;
      height: 46px;
      margin-left: -15px;
      z-index: 5;
      transition: left 1s linear, top 1.6s ease-in-out;
    }
    .rb {
      position: relative;
      width: 30px;
      height: 46px;
    }
    .l .rb {
      transform: scaleX(-1);
    }
    .hd {
      position: absolute;
      left: 2px;
      top: 0;
      width: 26px;
      height: 24px;
      border-radius: 50% 50% 45% 45%;
      background: radial-gradient(circle at 35% 30%, #ff9a56, #E8742C 70%);
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .15);
    }
    .ey {
      position: absolute;
      top: 9px;
      left: 6px;
      width: 5px;
      height: 6px;
      border-radius: 50%;
      background: #fff6c8;
      box-shadow: 0 0 6px #ffe36b, 0 0 2px #fff;
    }
    .ey + .ey {
      left: 15px;
    }
    .bd {
      position: absolute;
      left: 6px;
      top: 24px;
      width: 18px;
      height: 15px;
      border-radius: 5px 5px 4px 4px;
      background: #d4601f;
      border: 1px solid #b24c14;
    }
    .boss .bd {
      border-color: var(--g);
    }
    .lg {
      position: absolute;
      top: 38px;
      left: 8px;
      width: 5px;
      height: 8px;
      background: #b24c14;
      border-radius: 2px;
    }
    .lg.r {
      left: 17px;
    }
    .cr {
      position: absolute;
      left: 3px;
      top: -10px;
      width: 24px;
      height: 12px;
      background: var(--g);
      clip-path: polygon(0 100%, 0 15%, 25% 55%, 50% 0, 75% 55%, 100% 15%, 100% 100%);
      z-index: 2;
    }
    .walking .lg {
      animation: lg .25s infinite alternate;
    }
    .walking .lg.r {
      animation-direction: alternate-reverse;
    }
    @keyframes lg {
      to {
        transform: translateY(-3px);
      }
    }
    .work .hd {
      animation: tp .18s infinite alternate;
    }
    @keyframes tp {
      to {
        transform: translateY(1.5px);
      }
    }
    .bub {
      position: absolute;
      bottom: 58px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      color: #0A2A6B;
      font-size: 8px;
      padding: 2px 5px;
      border-radius: 6px;
      width: max-content;
      max-width: 78px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .4);
      z-index: 9;
      border: 1px solid #
